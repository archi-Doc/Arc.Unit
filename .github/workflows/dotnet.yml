name: Build, Test and Native AOT

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test with coverage
      run: dotnet test --project Arc.Unit.Tests/Arc.Unit.Tests.csproj --configuration Release --no-build --coverage --coverage-output-format cobertura --results-directory artifacts/coverage
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: artifacts/coverage
    - name: Native AOT smoke test
      run: |
        dotnet publish QuickStart/QuickStart.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishAot=true -p:TreatWarningsAsErrors=true --output artifacts/aot-quickstart
        ./artifacts/aot-quickstart/QuickStart example -string native-aot
